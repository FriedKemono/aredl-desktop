name: Build Windows exe

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch: {}

jobs:
  # every push to the main branch: build, and keep the .exe files as a downloadable artifact
  build:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: AREDL-Desktop-windows
          path: dist/*.exe

  # pushing a version tag (v1.0.1, v1.0.2 ...): build and publish a GitHub Release.
  # Installed copies of the app find it and update themselves.
  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
