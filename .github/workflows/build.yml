name: Build Windows exe and Mac app

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch: {}

jobs:
  # every push to the main branch: build, and keep the .exe files as a downloadable artifact
  build:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Add the Google OAuth client from the repository secrets
        shell: bash
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          node -e "require('fs').writeFileSync('drive-config.local.js','module.exports='+JSON.stringify({clientId:process.env.GOOGLE_CLIENT_ID||'',clientSecret:process.env.GOOGLE_CLIENT_SECRET||''}))"
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: AREDL-Desktop-windows
          path: dist/*.exe

  # pushing a version tag (v1.0.1, v1.0.2 ...): build and publish a GitHub Release.
  # Installed copies of the app find it and update themselves.
  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Add the Google OAuth client from the repository secrets
        shell: bash
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          node -e "require('fs').writeFileSync('drive-config.local.js','module.exports='+JSON.stringify({clientId:process.env.GOOGLE_CLIENT_ID||'',clientSecret:process.env.GOOGLE_CLIENT_SECRET||''}))"
      - run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # the Mac app: built on a Mac runner, saved as a downloadable artifact on every push to the main branch
  build-mac:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Add the Google OAuth client from the repository secrets
        shell: bash
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          node -e "require('fs').writeFileSync('drive-config.local.js','module.exports='+JSON.stringify({clientId:process.env.GOOGLE_CLIENT_ID||'',clientSecret:process.env.GOOGLE_CLIENT_SECRET||''}))"
      - run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: AREDL-Desktop-mac
          path: |
            dist/*.dmg
            dist/*.zip

  # a version tag: once the Windows release above exists, add the Mac downloads to the same release.
  # The .dmg is the installer; the .zip is what installed Mac apps download to update themselves (see mac-updater.js).
  release-mac:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: release
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Add the Google OAuth client from the repository secrets
        shell: bash
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          node -e "require('fs').writeFileSync('drive-config.local.js','module.exports='+JSON.stringify({clientId:process.env.GOOGLE_CLIENT_ID||'',clientSecret:process.env.GOOGLE_CLIENT_SECRET||''}))"
      - run: npm run dist:mac
      - run: gh release upload "${{ github.ref_name }}" dist/*.dmg dist/*.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
