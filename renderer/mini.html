<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AREDL Desktop</title>
<link rel="stylesheet" href="styles.css">
<style>
  /* the corner player: the same player as before, in a see-through window with room around it for its corner grips and shadow */
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent !important; }
  body { display: block; }
  .video-dock.mini { position: fixed !important; transform: none !important; transition: none !important; z-index: 1; visibility: visible; background: #000 var(--poster) center / cover; }
  /* the shadow fits in the room around the player, so it fades out before the edge of the window instead of being cut off */
  .video-dock.mini { box-shadow: 0 10px 30px rgba(0,0,0,.6), 0 0 0 1px color-mix(in srgb, var(--accent) 14%, transparent) !important; }
  .video-dock.mini:hover, .video-dock.mini.dragging { box-shadow: 0 12px 34px rgba(0,0,0,.64), 0 0 0 1px var(--accent-soft2), 0 0 24px var(--accent-soft) !important; }
  /* while the video is being handed over from the app, its picture shows and the player appears the moment it plays */
  /* the picture is clipped by its own rounded box, so the video never reaches past the player's rounded corners */
  .video-dock.mini { background-clip: padding-box; }
  .video-dock.mini.gliding { transform: var(--glide) !important; transform-origin: 0 0; will-change: transform; }
  .video-dock.mini.gliding.run { transform: none !important; transition: transform var(--glide-ms, 300ms) cubic-bezier(.22, .9, .25, 1) !important; }
  .video-dock.mini .mp-clip { position: absolute; inset: 0; overflow: hidden; isolation: isolate; border-radius: calc(var(--radius) - 1px); clip-path: inset(0 round calc(var(--radius) - 1px)); transform: translateZ(0); }
  .video-dock.mini iframe { transition: opacity .18s; border-radius: 0 !important; }
  .video-dock.mini:not(.ready) iframe { opacity: 0; }
</style>
</head>
<body>
<div class="video-dock mini">
  <div class="mp-clip"><iframe title="Video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>
  <div class="mp-bar">
    <span class="mp-grip" aria-hidden="true"></span>
    <span class="mp-title"></span>
    <button class="mp-btn" data-mp="return" title="Back to the level" aria-label="Back to the level"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5L3.5 9.5 8 14"/><path d="M3.5 9.5H12a4.5 4.5 0 0 1 4.5 4.5v1"/></svg></button>
    <button class="mp-btn" data-mp="close" title="Close player" aria-label="Close player"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M5 5l10 10M15 5L5 15"/></svg></button>
  </div>
  <div class="mp-resize" data-edge="tl"></div>
  <div class="mp-resize" data-edge="tr"></div>
  <div class="mp-resize" data-edge="bl"></div>
  <div class="mp-resize" data-edge="br"></div>
  <div class="mp-resize mp-edge" data-edge="t"></div>
  <div class="mp-resize mp-edge" data-edge="b"></div>
  <div class="mp-resize mp-edge" data-edge="l"></div>
  <div class="mp-resize mp-edge" data-edge="r"></div>
</div>
<script src="mini.js"></script>
</body>
</html>
